<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="coreGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Inner safe-zone (scaled down into central 80%) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Outer connecting neural / social network lines -->
    <g stroke="url(#glowGradMask)" stroke-width="8" stroke-linecap="round" opacity="0.45">
      <line x1="256" y1="130" x2="150" y2="230" />
      <line x1="256" y1="130" x2="362" y2="230" />
      <line x1="150" y1="230" x2="180" y2="360" />
      <line x1="362" y1="230" x2="332" y2="360" />
      <line x1="180" y1="360" x2="332" y2="360" />
      <line x1="256" y1="130" x2="256" y2="256" />
      <line x1="150" y1="230" x2="256" y2="256" />
      <line x1="362" y1="230" x2="256" y2="256" />
      <line x1="180" y1="360" x2="256" y2="256" />
      <line x1="332" y1="360" x2="256" y2="256" />
    </g>

    <!-- Node circles (Network nodes) -->
    <circle cx="256" cy="130" r="22" fill="#38bdf8" />
    <circle cx="150" cy="230" r="18" fill="#818cf8" />
    <circle cx="362" cy="230" r="18" fill="#818cf8" />
    <circle cx="180" cy="360" r="18" fill="#ec4899" />
    <circle cx="332" cy="360" r="18" fill="#ec4899" />

    <!-- Center pulse / Calm Mind Aura -->
    <circle cx="256" cy="256" r="48" fill="url(#coreGradMask)" />
    <circle cx="256" cy="256" r="56" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 6" opacity="0.8" />
    
    <!-- Stylized inner calm icon (heartbeat / serenity path) -->
    <path d="M 228 256 L 244 256 L 252 238 L 260 274 L 268 256 L 284 256" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
